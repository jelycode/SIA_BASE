<div class="user-container">
  


  <div class="divider"></div>

  <div class="user-profile">
    <div class="avatar-wrapper">
      <img src="https://png.pngtree.com/png-clipart/20230927/original/pngtree-man-avatar-image-for-profile-png-image_13001877.png" alt="User Profile" class="avatar-img">
    </div>
    
    <div class="user-details">
      <div class="name-row">
        <span class="user-name">Mario G.</span>
        <!-- <lucide-icon [name]="ChevronIcon" class="icon-chevron"></lucide-icon> -->
      </div>
      <span class="user-badge">Admin User</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="system-actions">
    <div class="notification-wrapper">
      <lucide-icon [name]="BellIcon" class="icon-action"></lucide-icon>
      <span class="notification-dot"></span>
    </div>
    <lucide-icon [name]="SettingsIcon" class="icon-action"></lucide-icon>
  </div>

</div>
