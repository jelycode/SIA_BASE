<div
  class="ui-select-wrapper"
  [class.ui-select-wrapper--disabled]="disabled"
  [class.ui-select-wrapper--top]="label() && labelPosition() === 'top'"
  [class.ui-select-wrapper--left]="label() && labelPosition() === 'left'"
>

  <!-- Label -->
  <label *ngIf="label()" class="ui-select-label-top">{{ label() }}</label>

  <div class="ui-select-main" [style.width]="width()">

    <!-- Control principal -->
    <div
      class="ui-select-container"
      [class.ui-select--disabled]="disabled"
      [class.ui-select--open]="isOpen"
      (click)="toggleDropdown()"
    >
      <!-- Tags de seleccionados -->
      <div class="ui-tag-area">
        <span
          *ngFor="let item of selectedItems"
          class="ui-tag"
          (click)="$event.stopPropagation()"
        >
          <span class="ui-tag-text">{{ item.label }}</span>
          <span
            class="ui-tag-remove"
            (click)="removeItem(item, $event)"
            role="button"
            [attr.aria-label]="'Quitar ' + item.label"
          >&#x2715;</span>
        </span>

        <!-- Placeholder -->
        <span class="ui-placeholder-text" *ngIf="selectedItems.length === 0">
          {{ placeholder }}
        </span>
      </div>

      <!-- Flecha -->
      <span class="ui-arrow" [style.transform]="isOpen ? 'rotate(180deg)' : 'rotate(0deg)'">
        &#9660;
      </span>
    </div>

    <!-- Dropdown -->
    <div class="ui-dropdown" *ngIf="isOpen">
      <ng-container *ngFor="let group of groups">
        <div class="ui-group-header" *ngIf="group.label">{{ group.label }}</div>
        <div
          *ngFor="let opt of group.options"
          class="ui-option"
          [class.ui-option--selected]="isSelected(opt)"
          (click)="toggleOption(opt, $event)"
        >
          {{ opt.label }}
        </div>
      </ng-container>
    </div>

  </div>
</div>
