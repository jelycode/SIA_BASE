<div class="layout-wrapper">
  <header class="glass-header">
    <div class="header-section brand">
      <button class="hamburger-btn" (click)="toggleSidebar()">
        <lucide-icon [name]="MenuIcon"></lucide-icon>
      </button>      
      <span class="system-name">APEX</span>
    </div>

    <div class="search-container" >
      <lib-top-search></lib-top-search>
    </div>

    <div class="divider"></div>

    <lib-user-info></lib-user-info>

  </header>

  <div class="layout-body" 
       [class.sidebar-closed]="!isSidebarOpen"
       [class.is-resizing]="isResizing()">
    <aside class="sidebar" [style.width.px]="isSidebarOpen ? sidebarWidth() : 0">
        <lib-ui-tree 
          [nodes]="menuItems" 
          [activeId]="activeMenuId"
          (nodeClick)="cambiarVista($event)">
        </lib-ui-tree>

        <!-- Tirador para redimensionar -->
        <div class="sidebar-resizer" 
             (mousedown)="onResizeStart($event)">
        </div>
    </aside>
    <aside>
    <main class="content-area">
      <router-outlet>
        
      </router-outlet>
    </main>
    </aside>
  </div>
  <footer class="footer">
    <div class="header-section brand">
       Bupa Seguros | 
    </div>  
  </footer>  
      <!-- <footer class="footer">
    </footer> -->
</div>
