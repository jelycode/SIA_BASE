<div class="table-format" [formGroup]="form">

  <!-- Formato de 6 columnas -->
  <!-- FILA 1 -->
  <div class="cell col-6">
    <lib-ui-header icon="fa fa-file-text-o" text="Información de la póliza"></lib-ui-header>
  </div>
  <!-- FILA 2 -->
  <div class="cell col-1">
    <lib-ui-input label="Nro. Póliza" labelPosition="top" width="120px" formControlName="nroPoliza"></lib-ui-input>
  </div>
  <div class="cell col-1">
    <lib-ui-input label="Nombre Póliza/Producto" labelPosition="top" formControlName="nombrePoliza"
      width="350px"></lib-ui-input>
  </div>
  <div class="cell col-1">
    <lib-ui-select label="Estado" labelPosition="top" [options]="estadoProducto()"
      formControlName="estadoProducto"></lib-ui-select>
  </div>
  <div class="cell col-3">
    <lib-ui-button text="Condicionado" icon="fa fa-file-pdf-o" variant="--color-bg-primary"
      customClass="shadow-lg mt-3 my-custom-border" width="150px">
    </lib-ui-button>
  </div>
  <!-- FILA 3 -->
  <div class="cell col-1">
    <lib-ui-input label="Cód. Producto" labelPosition="top" width="45px"
      formControlName="codigoProducto"></lib-ui-input>
  </div>
  <div class="cell col-1">
    <lib-ui-select label="Tipo Producto" labelPosition="top" [options]="tiposProducto()"
      formControlName="tipoFicha"></lib-ui-select>
  </div>
  <div class="cell col-1">
    <lib-ui-multi-select label="Tipos de Póliza" labelPosition="top" [options]="tiposPoliza()" width="250px"
      formControlName="tipo"></lib-ui-multi-select>
  </div>
  <div class="cell col-1">
    <lib-ui-select label="Tipo Prestacion" labelPosition="top" [options]="tiposPrestacion()"></lib-ui-select>
  </div>
  <div class="cell col-2">
    <lib-ui-select label="Canal Venta" labelPosition="top" width="120px" [options]="canalOptions()"></lib-ui-select>
  </div>

  <!-- FILA 4 -->
  <div class="cell col-6">
    <br>
    <lib-ui-header icon="fa fa-file-text-o" text="Vigencias de la póliza"></lib-ui-header>
  </div>
  <!-- FILA 5 -->
  <div class="cell col-1">
    <lib-ui-input-date label="Vigencia Desde" labelPosition="top" formControlName="vigenciaDesde"></lib-ui-input-date>
  </div>
  <div class="cell col-1">
    <lib-ui-input-date label="Vigencia Hasta" labelPosition="top" formControlName="vigenciaHasta"></lib-ui-input-date>
  </div>
  <div class="cell col-1">
    <lib-ui-input label="Plazo de Termino" labelPosition="top" width="40px"
      formControlName="plazoTermino"></lib-ui-input>
  </div>
  <div class="cell col-1">
    <lib-ui-input label="Días de Retracto" labelPosition="top" width="40px"
      formControlName="diasRetracto"></lib-ui-input>
  </div>
  <div class="cell col-2">
    <lib-ui-input label="Días máx. cobro" labelPosition="top" width="45px"
      formControlName="diasMaxCobro"></lib-ui-input>
  </div>

  <!-- FILA 5 -->
  <div class="cell col-6">
    <br>
    <lib-ui-header icon="fa fa-file-text-o" text="Configuració de la póliza"></lib-ui-header>
  </div>
  <!-- FILA 6 -->
  <div class="cell col-1">
    <lib-ui-input label="Cant. Decimales" labelPosition="top" width="45px"
      formControlName="cantDecimales"></lib-ui-input>
  </div>
  <div class="cell col-1">
    <lib-ui-check label="Certificado Automático" labelPosition="top" [options]="optCertificadoAutomatico"
      checked="true"></lib-ui-check>
  </div>
  <div class="cell col-1">
    <lib-ui-check label="Prima Parcializada" labelPosition="top" [options]="optPrimaParcial" labelPosition="top"
      checked="false"></lib-ui-check>
  </div>
  <div class="cell col-1">
    <lib-ui-check label="Cálculo Prima por Edad" labelPosition="top" [options]="optCalculoPrimaPorEdad"
      checked="true"></lib-ui-check>
  </div>
  <div class="cell col-2">
    <lib-ui-select label="Dias Rehabilitación" labelPosition="top" width="120px" [options]="tiposPoliza()"></lib-ui-select>
  </div>


  <div class="cell col-6">
    <br>
    <lib-ui-header icon="fa fa-file-text-o" text="Datos Contrante"></lib-ui-header>
  </div>
  <!-- FILA 4: Contratante -->
  <div class="cell col-1">
    <lib-ui-input label="Rut Contratante" labelPosition="top" width="120px"  formControlName="rutContratante" [tooltipText]="'tooltip'"
      [tooltipPosition]="'top'"></lib-ui-input>
  </div>
  <div class="cell col-5">
    <lib-ui-input label="Nombre Contratante" labelPosition="top" formControlName="nombreContratante" width="350px"
      [tooltipText]="'Este es un campo importante para la configuración.'" [tooltipPosition]="'left'"></lib-ui-input>

  </div>

</div>
