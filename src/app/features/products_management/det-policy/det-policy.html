<form [formGroup]="policyForm" class="policy-container">
  <header class="header-section">
    <div class="breadcrumb">BUPA Seguros / BUPA / Colectivo / <b>20454</b></div>
    <h2 class="title">Pólizas Colectivo</h2>
  </header>

  <fieldset class="section-group">
    <legend>Detalle de Póliza</legend>

    <table>
      <tr>
        <td>
          <lib-ui-label text="Póliza" variant="bold"></lib-ui-label>
        </td>
        <td>
          <lib-ui-input label="Póliza" formControlName="txtPoliza" width="60px"></lib-ui-input>
        </td>
        <td>
          <lib-ui-label text="Nombre" variant="bold"></lib-ui-label>
        </td>
        <td>
          <lib-ui-input formControlName="txtNombre" width="320px"></lib-ui-input>
        </td>
        <td>
          <lib-ui-label text="Fecha Inicio" variant="bold"></lib-ui-label>
        </td>
        <td>
          <lib-ui-input-date
            formControlName="txtFechaInicio"
            [width]="'170px'"
            placeholder="dd/mm/aaaa"
          />
        </td>
        <td>
          <lib-ui-label text="Fecha Fin" variant="bold"></lib-ui-label>
        </td>
        <td>
          <lib-ui-input-date
            formControlName="txtFechaFin"
            [width]="'170px'"
            placeholder="dd/mm/aaaa"
          />
        </td>
      </tr>

      <tr>
        <td></td>
        <td></td>
        <td>
          <lib-ui-label text="Tipo Producto" variant="bold"></lib-ui-label>
        </td>
        <td>
          <lib-ui-input
            formControlName="txtTipoProducto"
            value="Colectivo"
            [disabled]="true"
            [readonly]="true"
            width="150px"
          ></lib-ui-input>
        </td>
        <td>
          <lib-ui-label text="Tipos de Coberturas" variant="bold"></lib-ui-label>
        </td>
        <td colspan="3">
          <lib-ui-multi-select
            [options]="tipoCoberturas"
            width="300px"
            formControlName="tipoCoberturas"
            placeholder="Seleccione coberturas..."
            (selectionChange)="onCoberturaChange($event)"
          ></lib-ui-multi-select>
        </td>
      </tr>

      <tr>
        <td>
          <lib-ui-label text="Cobertura (select simple)" variant="bold"></lib-ui-label>
        </td>
        <td colspan="7">
          <lib-ui-select
            [options]="tipoCoberturas"
            [width]="'300px'"
            formControlName="tipoCoberturaUnica"
            placeholder="Seleccione una cobertura..."
            (selectionChange)="onTipoCoberturaChange($event)"
          />
        </td>
      </tr>

      <tr>
        <td>
          <lib-ui-label text="Renovación automática" variant="bold"></lib-ui-label>
        </td>
        <td colspan="7">
          <lib-ui-radio
            formControlName="renovacionAutomatica"
            [options]="opcionesRenovacion"
            orientation="horizontal"
            [width]="'100%'"
          />
        </td>
      </tr>

      <tr>
        <td colspan="8">
          <lib-ui-radio
            formControlName="metodoPago"
            label="Forma de pago"
            [options]="opcionesMetodoPago"
            orientation="vertical"
            [width]="'100%'"
          />
        </td>
      </tr>

      <tr>
        <td colspan="8">
          <lib-ui-check
            formControlName="canalesNotificacion"
            label="Notificaciones (inline)"
            [options]="opcionesNotificacion"
            orientation="horizontal"
            [width]="'100%'"
          />
        </td>
      </tr>

      <tr>
        <td colspan="8">
          <lib-ui-check
            formControlName="documentosIncluidos"
            label="Documentación a incluir"
            [options]="opcionesDocumentos"
            orientation="vertical"
            [width]="'100%'"
          />
        </td>
      </tr>

      <!-- ── Archivo adjunto ─────────────────────────────────── -->
      <tr>
        <td>
          <lib-ui-label text="Archivo póliza" variant="bold"></lib-ui-label>
        </td>
        <td colspan="7">
          <lib-ui-input-file
            formControlName="archivoPoliza"
            label="File input"
            placeholder="Choose file"
            browseLabel="Browse"
            accept=".pdf,.doc,.docx,.xlsx"
            hint="Formatos permitidos: PDF, Word, Excel"
            [width]="'350px'"
          />
        </td>
      </tr>
      <!-- ─────────────────────────────────────────────────────── -->

    </table>

    <div class="actions-footer">
      <lib-ui-button text="Grabar"  [icon]="SaveIcon"   variant="--color-bg-primary"   width="140px"></lib-ui-button>
      <lib-ui-button text="Buscar"  [icon]="SearchIcon" variant="--color-bg-secondary"  width="140px"></lib-ui-button>
    </div>
  </fieldset>
</form>
